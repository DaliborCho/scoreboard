name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # A database, because the pure tests once passed while a shadowed name
    # turned the metric catalogue into a database row. Tests that never touch
    # storage cannot see that class of defect.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: scoreboard
          POSTGRES_PASSWORD: scoreboard
          POSTGRES_DB: scoreboard_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://scoreboard:scoreboard@localhost:5432/scoreboard_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Schema
        working-directory: backend
        run: alembic upgrade head

      - name: Tests
        working-directory: backend
        # Most of the suite is pure or runs against recorded fixtures, so no
        # credential is ever needed. The database-backed module skips itself
        # when DATABASE_URL is unreachable, which keeps the suite runnable
        # anywhere while still covering the read and write path here.
        run: pytest -q

      - name: Lint
        working-directory: backend
        run: ruff check src tests

  pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Syntax-check the served pages
        # The served pages have no build step, so nothing else catches a
        # broken string literal until a browser shows a blank screen.
        run: python tools/check_pages.py

  kiosk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The television's half runs where nobody is watching, on a machine we
      # have no access to. A shell mistake there is a dark wall, discovered by
      # whoever walks past it.
      - name: Shellcheck the kiosk scripts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck kiosk/kiosk.sh kiosk/install.sh

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: scoreboard
          POSTGRES_PASSWORD: scoreboard
          POSTGRES_DB: scoreboard_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Migrations apply to an empty database
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://scoreboard:scoreboard@localhost:5432/scoreboard_ci
        run: alembic upgrade head

      - name: Models and migrations agree
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://scoreboard:scoreboard@localhost:5432/scoreboard_ci
        # Drift is invisible in development, where the container was migrated
        # by hand long ago, and surfaces as a broken deploy.
        run: python ../tools/check_migrations.py
