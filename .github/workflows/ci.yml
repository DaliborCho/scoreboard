name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Tests
        working-directory: backend
        # No database service. Every rule the suite covers — metrics,
        # leaderboards, themes, charts, scheduling, permissions, Tableau
        # parsing — is pure or runs against recorded fixtures, which is what
        # keeps CI fast and keeps credentials out of it.
        run: pytest -q

      - name: Lint
        working-directory: backend
        run: ruff check src tests

  pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Syntax-check the served pages
        # The two HTML pages have no build step, so nothing else catches a
        # broken string literal until a browser shows a blank screen.
        run: python tools/check_pages.py

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: scoreboard
          POSTGRES_PASSWORD: scoreboard
          POSTGRES_DB: scoreboard_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Migrations apply to an empty database
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://scoreboard:scoreboard@localhost:5432/scoreboard_ci
        run: alembic upgrade head

      - name: Models and migrations agree
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://scoreboard:scoreboard@localhost:5432/scoreboard_ci
        # Drift is invisible in development, where the container was migrated
        # by hand long ago, and surfaces as a broken deploy.
        run: python ../tools/check_migrations.py
