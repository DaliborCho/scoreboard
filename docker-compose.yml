services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scoreboard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scoreboard}
      POSTGRES_DB: ${POSTGRES_DB:-scoreboard_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scoreboard}"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-scoreboard}:${POSTGRES_PASSWORD:-scoreboard}@db:5432/${POSTGRES_DB:-scoreboard_dev}
    ports:
      - "8000:8000"
    volumes:
      - ./backend/src:/app/src
      - ./backend/tests:/app/tests
      - ./backend/alembic:/app/alembic
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn scoreboard.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/src"

volumes:
  postgres-data:
