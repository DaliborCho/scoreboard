[project]
name = "scoreboard"
version = "0.1.0"
description = "Multi-tenant sales leaderboard platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "cryptography>=44.0",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "DTZ", "RUF", "S", "BLE"]
ignore = [
    # Depends(...) in an argument default is the FastAPI idiom, not a mistake.
    "B008",
    # The executable bit comes from the Windows bind mount, not from the file.
    "EXE002",
]

[tool.ruff.lint.per-file-ignores]
# urlopen against a URL built from saved connection settings, not user input;
# and a broad catch so one malformed Tableau response cannot end a refresh.
"src/scoreboard/connectors/tableau.py" = ["S310", "BLE001"]
# Seeded RNG for demo figures. Nothing here is a secret.
"src/scoreboard/connectors/mock.py" = ["S311"]
# Constant *names* that look like secrets to a scanner; the values are
# placeholders, and the real ones come from the environment.
"src/scoreboard/config.py" = ["S105"]
"src/scoreboard/seed.py" = ["S105"]
# A failed decrypt must return a clean error, whatever the library raised.
"src/scoreboard/security.py" = ["BLE001"]
# The health endpoint reports a database problem rather than becoming one.
"src/scoreboard/api/routes.py" = ["BLE001"]
# Tests assert on behaviour; asserts and hard-coded sample credentials are the
# point of them.
"tests/*" = ["S101", "S105", "S106", "BLE001"]
# The worker and scheduler catch broadly on purpose: one customer's broken
# source must not end the pass for everybody else.
"src/scoreboard/worker.py" = ["BLE001"]
"src/scoreboard/services/scheduler.py" = ["BLE001"]
