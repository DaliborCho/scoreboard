<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scoreboard Platform Admin</title>
<style>
/* A calm, light interface. The board on the wall is the loud thing; the tool
   used to configure it should get out of the way. Everything here is built
   from four surfaces, one accent and a hairline. */
:root {
  --bg: #f5f5f7;
  --card: #ffffff;
  --sunken: #f0f0f3;
  --text: #1d1d1f;
  --muted: #6e6e73;
  --line: #d8d8dd;
  --line-soft: #ececf0;
  --accent: #8a5a00;
  --accent-soft: #fdf3e0;
  --good: #1d7f36;
  --good-soft: #e8f6ec;
  --bad: #c9202e;
  --bad-soft: #fdecee;
  --shadow: 0 1px 2px rgba(0,0,0,.05), 0 8px 24px rgba(0,0,0,.05);
  --r: 12px;
  --r-sm: 8px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
/* An author `display` rule outranks the user-agent rule behind the HTML
   `hidden` attribute, so `.wrap { display: grid }` would keep the app
   shell on screen underneath the sign-in form. */
[hidden] { display: none !important; }

body {
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  font: 15px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI",
        system-ui, Roboto, sans-serif;
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

/* ---------------------------------------------------------------- controls */
button {
  font: inherit; font-weight: 500; cursor: pointer;
  border: 1px solid var(--line); background: var(--card); color: var(--text);
  padding: .5rem 1rem; border-radius: var(--r-sm);
  transition: background .15s ease, border-color .15s ease, transform .06s ease;
}
button:hover:not(:disabled) { background: var(--sunken); }
/* A small press. Enough to feel like the button did something, not enough to
   move anything around it. */
button:active:not(:disabled) { transform: scale(.975); }
button:focus-visible { outline: none; box-shadow: 0 0 0 3.5px var(--accent-soft), 0 0 0 1.5px var(--accent); }
button:disabled { opacity: .4; cursor: not-allowed; }

button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.primary:hover:not(:disabled) { background: #7a4f00; border-color: #7a4f00; }
button.danger { color: var(--bad); border-color: #eccdd1; }
button.danger:hover:not(:disabled) { background: var(--bad-soft); }
button.sm { padding: .3rem .7rem; font-size: 13.5px; border-radius: 7px; }
button.ghost { border-color: transparent; background: transparent; color: var(--accent); }
button.ghost:hover:not(:disabled) { background: var(--accent-soft); }

input, select, textarea {
  font: inherit; background: var(--card); color: var(--text);
  border: 1px solid var(--line); border-radius: var(--r-sm);
  padding: .5rem .7rem; width: 100%;
  transition: border-color .15s ease, box-shadow .15s ease;
}
input:focus, select:focus, textarea:focus {
  outline: none; border-color: var(--accent);
  box-shadow: 0 0 0 3.5px var(--accent-soft);
}
input[type=color] { padding: 3px; height: 2.5rem; cursor: pointer; }
input[type=file] { border: 1px dashed var(--line); background: var(--sunken); padding: .45rem; font-size: 13px; }
select {
  appearance: none;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' stroke='%236e6e73' stroke-width='1.8' fill='none' stroke-linecap='round'/></svg>");
  background-repeat: no-repeat; background-position: right .7rem center; padding-right: 2rem;
}
label {
  display: block; font-size: 13px; font-weight: 500;
  color: var(--muted); margin-bottom: .3rem; letter-spacing: 0; text-transform: none;
}

table { width: 100%; border-collapse: collapse; }
th, td { padding: .7rem .6rem; text-align: right; border-bottom: 1px solid var(--line-soft); white-space: nowrap; }
tbody tr:last-child td { border-bottom: none; }
tbody tr:hover td { background: #fafafc; }
th:first-child, td:first-child, th.l, td.l { text-align: left; }
th { font-size: 13px; font-weight: 500; color: var(--muted); border-bottom: 1px solid var(--line); }
tfoot td { font-weight: 600; border-top: 1px solid var(--line); border-bottom: none; }
code {
  background: var(--sunken); padding: .2rem .45rem; border-radius: 6px;
  font: 500 13px/1.4 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  word-break: break-all;
}

/* ---------------------------------------------------------------- shell */
.wrap { display: grid; grid-template-columns: 232px 1fr; min-height: 100vh; }
nav {
  background: var(--card); border-right: 1px solid var(--line);
  padding: 1.3rem .8rem; display: flex; flex-direction: column;
}
nav h1 { font-size: 17px; font-weight: 600; letter-spacing: -.01em; margin: .1rem .6rem 1.1rem; }
nav button {
  display: block; width: 100%; text-align: left; border: none; background: none;
  color: var(--text); font-weight: 400; padding: .5rem .6rem; margin-bottom: 1px;
  border-radius: var(--r-sm);
}
nav button:hover { background: var(--sunken); }
nav button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
nav .who {
  margin-top: auto; padding-top: .9rem; border-top: 1px solid var(--line-soft);
  font-size: 13px; color: var(--muted); line-height: 1.45;
}
nav .who b { color: var(--text); font-weight: 600; }

main { padding: 2rem 2.2rem; max-width: 1400px; }
h2 { font-size: 26px; font-weight: 600; letter-spacing: -.02em; margin-bottom: .2rem; }
.hint { color: var(--muted); font-size: 14px; margin-bottom: 1.4rem; }

.card {
  background: var(--card); border: 1px solid var(--line-soft); border-radius: var(--r);
  padding: 1.3rem 1.4rem; margin-bottom: 1.1rem; box-shadow: var(--shadow);
}
.card h3 { font-size: 16px; font-weight: 600; margin-bottom: .9rem; letter-spacing: -.01em; }

.row { display: flex; gap: .8rem; align-items: flex-end; flex-wrap: wrap; }
.row > * { flex: 1; min-width: 140px; }
.row > .fixed { flex: none; min-width: 0; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: .9rem; }

.pill {
  display: inline-block; font-size: 12px; font-weight: 500;
  padding: .12rem .55rem; border-radius: 999px;
  background: var(--sunken); color: var(--muted);
}
.pill.on { background: var(--good-soft); color: var(--good); }
.pill.off { background: var(--bad-soft); color: var(--bad); }

/* ---------------------------------------------------------------- feedback */
#toast {
  position: fixed; right: 1.4rem; bottom: 1.4rem; max-width: 30rem;
  padding: .85rem 1.1rem; border-radius: var(--r); display: none; z-index: 50;
  background: var(--card); border: 1px solid var(--line);
  box-shadow: 0 8px 30px rgba(0,0,0,.16); white-space: pre-wrap; font-size: 14px;
}
#toast.show { display: block; animation: rise .22s ease; }
#toast.bad { border-color: #f0c8cd; background: var(--bad-soft); color: #8c1520; }
#toast.good { border-color: #c5e6cf; background: var(--good-soft); color: #14612a; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } }

#login { max-width: 23rem; margin: 14vh auto; }
#login .card { padding: 1.9rem; }
#login h2 { text-align: center; }
#login .hint { text-align: center; }
.stack > * + * { margin-top: .9rem; }

#modal {
  position: fixed; inset: 0; background: rgba(0,0,0,.32); backdrop-filter: blur(3px);
  display: flex; align-items: center; justify-content: center; padding: 1.5rem; z-index: 60;
  animation: fade .16s ease;
}
#modal .card {
  max-width: 34rem; width: 100%; max-height: 82vh; overflow: auto; margin: 0;
  box-shadow: 0 20px 60px rgba(0,0,0,.28); animation: pop .18s ease;
}
@keyframes fade { from { opacity: 0; } }
@keyframes pop { from { opacity: 0; transform: scale(.97) translateY(6px); } }

/* ---------------------------------------------------------------- theme editor */
.swatchgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: .9rem; }
.ratio {
  display: flex; justify-content: space-between; align-items: center;
  padding: .5rem 0; border-bottom: 1px solid var(--line-soft); font-size: 14px;
}
.ratio:last-child { border-bottom: none; }
.ratio b { font-weight: 600; }
.ratio b.ok { color: var(--good); }
.ratio b.no { color: var(--bad); }
.preview { border-radius: var(--r-sm); padding: 1.1rem; margin-top: .9rem; }

.artgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; }
.artslot { background: var(--sunken); border-radius: var(--r-sm); padding: .9rem; }
.artslot label { margin-bottom: .1rem; color: var(--text); font-weight: 600; }
.artprev {
  height: 78px; border: 1px solid var(--line); border-radius: 7px; background: #2a2c31;
  display: flex; align-items: center; justify-content: center; overflow: hidden;
}
.artprev img { max-height: 100%; max-width: 100%; object-fit: contain; }
.artprev .none { color: #8b8d93; font-size: 12.5px; }

.widgetrow {
  display: grid; grid-template-columns: 1.1fr 1.2fr 1fr .8fr auto; gap: .6rem;
  align-items: end; margin-bottom: .6rem;
}
.moverow { display: grid; grid-template-columns: 1fr 12rem; gap: .6rem; align-items: center; margin-bottom: .5rem; }

/* The preview is the television's own page in a frame, scaled down. A second
   renderer would drift from the wall it claims to represent. */
.boardwrap {
  position: relative; width: 100%; padding-top: 56.25%; border-radius: var(--r-sm);
  overflow: hidden; border: 1px solid var(--line); background: #000;
}
.boardwrap iframe { position: absolute; inset: 0; width: 1600px; height: 900px; border: 0; transform-origin: 0 0; }

/* A team's crest, shown wherever the team is named. */
.crest { height: 26px; width: 26px; object-fit: contain; vertical-align: middle; margin-right: .55rem; flex: none; }
.crest.blank { border-radius: 6px; display: inline-block; }
.teamname { display: flex; align-items: center; }

/* ---------------------------------------------------------------- platform */
header.bar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 1rem 2.2rem; border-bottom: 1px solid var(--line); background: var(--card);
}
header.bar h1 { font-size: 17px; font-weight: 600; letter-spacing: -.01em; }
header.bar .tag {
  font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
  color: var(--accent); background: var(--accent-soft);
  padding: .15rem .5rem; border-radius: 999px; margin-left: .5rem;
}
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: .9rem; }
.stat { background: var(--sunken); border-radius: var(--r-sm); padding: .9rem 1rem; }
.stat .k { font-size: 13px; color: var(--muted); margin-bottom: .15rem; }
.stat .v { font-size: 28px; font-weight: 600; letter-spacing: -.02em; }
.warn { border-color: #efd9a8; background: #fdf8ec; }
</style>
</head>
<body>

<div id="login" hidden>
  <div class="card stack">
    <h2>Platform admin</h2>
    <div class="hint">Operator sign-in. Company staff use <a href="/console">the console</a>.</div>
    <div><label>Username</label><input id="li-user" autocomplete="username"></div>
    <div><label>Password</label><input id="li-pass" type="password" autocomplete="current-password"></div>
    <button class="primary" id="li-go" style="width:100%">Sign in</button>
  </div>
</div>

<div id="app" hidden>
  <header class="bar">
    <div><h1>Scoreboard <span class="tag">platform admin</span></h1></div>
    <div style="display:flex;gap:.6rem;align-items:center">
      <span class="pill" id="who"></span>
      <a href="/console"><button class="sm">Company console</button></a>
      <button class="sm" id="logout">Sign out</button>
    </div>
  </header>
  <main id="view"></main>
</div>

<div id="modal" hidden></div>
<div id="toast"></div>

<script>
"use strict";

const state = { token: localStorage.getItem("sb_admin_token") || "", me: null };

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const num = (n) => Number(n || 0).toLocaleString("en-US");

function toast(message, kind) {
  const box = $("toast");
  box.textContent = message;
  box.className = "show " + (kind || "");
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => box.className = "", kind === "bad" ? 9000 : 4500);
}

function describe(detail) {
  if (typeof detail === "string") return detail;
  if (Array.isArray(detail)) return detail.map(d => d.msg || describe(d)).join("\n");
  if (detail && typeof detail === "object") return detail.error || JSON.stringify(detail);
  return String(detail);
}

async function api(path, options = {}) {
  const response = await fetch("/api/v1" + path, {
    ...options,
    headers: {
      "Content-Type": "application/json",
      ...(state.token ? { Authorization: "Bearer " + state.token } : {}),
    },
  });
  const text = await response.text();
  const body = text ? JSON.parse(text) : {};
  if (!response.ok) {
    if (response.status === 401 && state.token) signOut(true);
    throw new Error(describe(body.detail ?? body));
  }
  return body;
}

async function guard(action) {
  try { await action(); } catch (error) { toast(error.message, "bad"); }
}

// Same dialog approach as the console: window.prompt and window.confirm are
// blocked outright in some embedded browsers, where a delete button would
// silently do nothing.
function dialog(title, bodyHtml, onConfirm, confirmLabel = "Save") {
  const host = $("modal");
  host.innerHTML = `<div class="card">
      <h3>${esc(title)}</h3>
      <div class="stack">${bodyHtml}</div>
      <div class="row" style="margin-top:1rem;justify-content:flex-end">
        <div class="fixed"><button id="dlg-cancel">Cancel</button></div>
        <div class="fixed"><button class="primary" id="dlg-ok">${esc(confirmLabel)}</button></div>
      </div>
    </div>`;
  host.hidden = false;
  const close = () => { host.hidden = true; host.innerHTML = ""; document.removeEventListener("keydown", onKey); };
  const onKey = (e) => { if (e.key === "Escape") close(); };
  document.addEventListener("keydown", onKey);
  $("dlg-cancel").onclick = close;
  host.onclick = (e) => { if (e.target === host) close(); };
  $("dlg-ok").onclick = async () => {
    try { await onConfirm(close); } catch (error) { toast(error.message, "bad"); }
  };
  const first = host.querySelector("input, select");
  if (first) first.focus();
}

// ---------------------------------------------------------------- session
async function signIn() {
  try {
    const result = await api("/auth/login", {
      method: "POST",
      body: JSON.stringify({ email: $("li-user").value.trim(), password: $("li-pass").value }),
    });
    state.token = result.token;
    localStorage.setItem("sb_admin_token", result.token);
    await start();
  } catch (error) { toast(error.message, "bad"); }
}

function signOut(expired) {
  state.token = ""; state.me = null;
  localStorage.removeItem("sb_admin_token");
  $("app").hidden = true; $("login").hidden = false;
  if (expired) toast("Session ended. Sign in again.", "bad");
}

async function start() {
  let me;
  try { me = await api("/auth/me"); } catch { return signOut(); }

  // The platform routes answer 404 without the operator flag, so this is how
  // the page learns whether the account it just signed in is an operator.
  try { await api("/platform/stats"); }
  catch {
    signOut();
    toast("That account is not a platform operator. Company staff sign in at /console.", "bad");
    return;
  }

  state.me = me;
  $("login").hidden = true; $("app").hidden = false;
  $("who").textContent = me.user.email;
  render();
}

// ---------------------------------------------------------------- view
async function render() {
  $("view").innerHTML = `<div class="hint">Loading…</div>`;
  await guard(async () => {
    const [stats, { organizations }] = await Promise.all([
      api("/platform/stats"), api("/platform/organizations"),
    ]);

    const weakPassword = location.hostname === "localhost" || location.hostname.startsWith("192.168.");
    $("view").innerHTML = `
      <h2>Companies</h2>
      <div class="hint">Every customer on this installation.</div>

      ${weakPassword ? `<div class="card warn">
        <b>Demo credentials are in use.</b>
        <div class="hint" style="margin:.3rem 0 0">
          <code>admin / admin</code> and <code>demo / demo</code> exist so this is easy to look at.
          Change both before anyone outside this network can reach it.
        </div></div>` : ""}

      <div class="card"><div class="stats">
        ${[["Companies", stats.organizations], ["Active", stats.active_organizations],
           ["Accounts", stats.users], ["Teams", stats.teams], ["Reps", stats.reps],
           ["Displays", stats.displays], ["Screens", stats.screens], ["Sources", stats.sources]]
          .map(([k, v]) => `<div class="stat"><div class="k">${k}</div><div class="v">${num(v)}</div></div>`).join("")}
      </div></div>

      <div class="card"><h3>Add a company</h3>
        <div class="row">
          <div><label>Company name</label><input id="o-name" placeholder="Northgate Roofing"></div>
          <div><label>Sign-in handle</label><input id="o-user" placeholder="northgate"></div>
          <div><label>Password</label><input id="o-pass" placeholder="leave blank to generate"></div>
          <div class="fixed"><button class="primary" id="o-add">Create</button></div>
        </div>
        <div class="hint" style="margin:.6rem 0 0">Creates the company and its first owner account. The password is shown once.</div>
      </div>

      <div class="card"><table>
        <thead><tr>
          <th class="l">Company</th><th>Teams</th><th>Reps</th><th>People</th>
          <th>Displays</th><th>Screens</th><th class="l">Status</th><th></th>
        </tr></thead>
        <tbody>${organizations.map(o => `<tr>
          <td class="l"><b>${esc(o.name)}</b> <code>${esc(o.slug)}</code></td>
          <td>${num(o.counts.teams)}</td><td>${num(o.counts.reps)}</td>
          <td>${num(o.counts.people)}</td><td>${num(o.counts.displays)}</td>
          <td>${num(o.counts.screens)}</td>
          <td class="l">${o.is_active ? '<span class="pill on">active</span>' : '<span class="pill off">suspended</span>'}</td>
          <td>
            <button class="sm" data-rename="${o.id}" data-name="${esc(o.name)}">Rename</button>
            <button class="sm" data-toggle="${o.id}" data-active="${o.is_active}">${o.is_active ? "Suspend" : "Reactivate"}</button>
            <button class="sm" data-access="${o.id}" data-slug="${esc(o.slug)}">Open</button>
            <button class="sm danger" data-del="${o.id}" data-slug="${esc(o.slug)}">Delete</button>
          </td>
        </tr>`).join("") || `<tr><td class="l" colspan="8">No companies yet.</td></tr>`}</tbody>
      </table></div>`;

    $("o-add").onclick = () => guard(async () => {
      const created = await api("/platform/organizations", {
        method: "POST",
        body: JSON.stringify({
          name: $("o-name").value.trim(),
          owner_username: $("o-user").value.trim(),
          owner_password: $("o-pass").value,
        }),
      });
      // Redraw first so the new company and the updated counts are visible,
      // then put the credentials on top of the fresh page. Doing it the other
      // way round leaves stale totals beside a card announcing a new company.
      await render();
      $("view").insertAdjacentHTML("afterbegin",
        `<div class="card" style="border-color:var(--good)">
          <h3>${esc(created.name)} created</h3>
          <div>Sign in at <a href="/console">/console</a> with
            <code>${esc(created.owner.sign_in_with)}</code> /
            <code>${esc(created.owner.password)}</code></div>
          <div class="hint" style="margin-top:.5rem">${esc(created.owner.note)}</div>
        </div>`);
      toast("Company created", "good");
    });

    const on = (selector, handler) =>
      $("view").querySelectorAll(selector).forEach(node => node.onclick = () => handler(node));

    on("[data-rename]", node => dialog("Rename company",
      `<div><label>Name</label><input id="r-name" value="${esc(node.dataset.name)}"></div>`,
      async (close) => {
        await api(`/platform/organizations/${node.dataset.rename}`, {
          method: "PATCH", body: JSON.stringify({ name: $("r-name").value.trim() }) });
        close(); toast("Renamed", "good"); render();
      }));

    on("[data-toggle]", node => guard(async () => {
      const active = node.dataset.active === "true";
      await api(`/platform/organizations/${node.dataset.toggle}`, {
        method: "PATCH", body: JSON.stringify({ is_active: !active }) });
      toast(active ? "Suspended. Their sessions ended; televisions keep showing the board." : "Reactivated.", "good");
      render();
    }));

    on("[data-access]", node => guard(async () => {
      // Support access is a real membership, so it shows up in that
      // customer's own people list and audit log rather than being invisible.
      await api(`/platform/organizations/${node.dataset.access}/grant-me-access`, {
        method: "POST", body: JSON.stringify({ role: "owner" }) });
      toast(`You now have an owner account in ${node.dataset.slug}. Open /console and switch to it.`, "good");
    }));

    on("[data-del]", node => dialog(`Delete ${node.dataset.slug}`,
      `<div class="hint">This removes every team, person, screen, display and figure belonging to them. It cannot be undone.</div>
       <div><label>Type <b>${esc(node.dataset.slug)}</b> to confirm</label><input id="d-slug" placeholder="${esc(node.dataset.slug)}"></div>`,
      async (close) => {
        const result = await api(`/platform/organizations/${node.dataset.del}/delete`, {
          method: "POST", body: JSON.stringify({ confirm_slug: $("d-slug").value.trim() }) });
        close();
        toast(`Deleted ${result.deleted.name}: ${result.deleted.teams} teams, ${result.deleted.reps} reps.`, "good");
        render();
      }, "Delete for good"));
  });
}

$("li-go").onclick = signIn;
$("li-pass").onkeydown = (e) => { if (e.key === "Enter") signIn(); };
$("li-user").onkeydown = (e) => { if (e.key === "Enter") $("li-pass").focus(); };
$("logout").onclick = () => guard(async () => { await api("/auth/logout", { method: "POST" }); signOut(); });

if (state.token) start(); else { $("login").hidden = false; }
</script>
</body>
</html>
