<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scoreboard Console</title>
<style>
/* A calm, light interface. The board on the wall is the loud thing; the tool
   used to configure it should get out of the way. Everything here is built
   from four surfaces, one accent and a hairline. */
:root {
  --bg: #f5f5f7;
  --card: #ffffff;
  --sunken: #f0f0f3;
  --text: #1d1d1f;
  --muted: #6e6e73;
  --line: #d8d8dd;
  --line-soft: #ececf0;
  --accent: #0071e3;
  --accent-soft: #e8f2fd;
  --good: #1d7f36;
  --good-soft: #e8f6ec;
  --bad: #c9202e;
  --bad-soft: #fdecee;
  --shadow: 0 1px 2px rgba(0,0,0,.05), 0 8px 24px rgba(0,0,0,.05);
  --r: 12px;
  --r-sm: 8px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
/* An author `display` rule outranks the user-agent rule behind the HTML
   `hidden` attribute, so `.wrap { display: grid }` would keep the app
   shell on screen underneath the sign-in form. */
[hidden] { display: none !important; }

body {
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  font: 15px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI",
        system-ui, Roboto, sans-serif;
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

/* ---------------------------------------------------------------- controls */
button {
  font: inherit; font-weight: 500; cursor: pointer;
  border: 1px solid var(--line); background: var(--card); color: var(--text);
  padding: .5rem 1rem; border-radius: var(--r-sm);
  transition: background .15s ease, border-color .15s ease, transform .06s ease;
}
button:hover:not(:disabled) { background: var(--sunken); }
/* A small press. Enough to feel like the button did something, not enough to
   move anything around it. */
button:active:not(:disabled) { transform: scale(.975); }
button:focus-visible { outline: none; box-shadow: 0 0 0 3.5px var(--accent-soft), 0 0 0 1.5px var(--accent); }
button:disabled { opacity: .4; cursor: not-allowed; }

button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.primary:hover:not(:disabled) { background: #0077ed; border-color: #0077ed; }
button.danger { color: var(--bad); border-color: #eccdd1; }
button.danger:hover:not(:disabled) { background: var(--bad-soft); }
button.sm { padding: .3rem .7rem; font-size: 13.5px; border-radius: 7px; }
button.ghost { border-color: transparent; background: transparent; color: var(--accent); }
button.ghost:hover:not(:disabled) { background: var(--accent-soft); }

input, select, textarea {
  font: inherit; background: var(--card); color: var(--text);
  border: 1px solid var(--line); border-radius: var(--r-sm);
  padding: .5rem .7rem; width: 100%;
  transition: border-color .15s ease, box-shadow .15s ease;
}
input:focus, select:focus, textarea:focus {
  outline: none; border-color: var(--accent);
  box-shadow: 0 0 0 3.5px var(--accent-soft);
}
input[type=color] { padding: 3px; height: 2.5rem; cursor: pointer; }
input[type=file] { border: 1px dashed var(--line); background: var(--sunken); padding: .45rem; font-size: 13px; }
select {
  appearance: none;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' stroke='%236e6e73' stroke-width='1.8' fill='none' stroke-linecap='round'/></svg>");
  background-repeat: no-repeat; background-position: right .7rem center; padding-right: 2rem;
}
label {
  display: block; font-size: 13px; font-weight: 500;
  color: var(--muted); margin-bottom: .3rem; letter-spacing: 0; text-transform: none;
}

table { width: 100%; border-collapse: collapse; }
th, td { padding: .7rem .6rem; text-align: right; border-bottom: 1px solid var(--line-soft); white-space: nowrap; }
tbody tr:last-child td { border-bottom: none; }
tbody tr:hover td { background: #fafafc; }
th:first-child, td:first-child, th.l, td.l { text-align: left; }
th { font-size: 13px; font-weight: 500; color: var(--muted); border-bottom: 1px solid var(--line); }
tfoot td { font-weight: 600; border-top: 1px solid var(--line); border-bottom: none; }
code {
  background: var(--sunken); padding: .2rem .45rem; border-radius: 6px;
  font: 500 13px/1.4 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  word-break: break-all;
}

/* ---------------------------------------------------------------- shell */
.wrap { display: grid; grid-template-columns: 232px 1fr; min-height: 100vh; }
nav {
  background: var(--card); border-right: 1px solid var(--line);
  padding: 1.3rem .8rem; display: flex; flex-direction: column;
}
nav h1 { font-size: 17px; font-weight: 600; letter-spacing: -.01em; margin: .1rem .6rem 1.1rem; }
nav button {
  display: block; width: 100%; text-align: left; border: none; background: none;
  color: var(--text); font-weight: 400; padding: .5rem .6rem; margin-bottom: 1px;
  border-radius: var(--r-sm);
}
nav button:hover { background: var(--sunken); }
nav button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
nav .who {
  margin-top: auto; padding-top: .9rem; border-top: 1px solid var(--line-soft);
  font-size: 13px; color: var(--muted); line-height: 1.45;
}
nav .who b { color: var(--text); font-weight: 600; }

main { padding: 2rem 2.2rem; max-width: 1400px; }
h2 { font-size: 26px; font-weight: 600; letter-spacing: -.02em; margin-bottom: .2rem; }
.hint { color: var(--muted); font-size: 14px; margin-bottom: 1.4rem; }

.card {
  background: var(--card); border: 1px solid var(--line-soft); border-radius: var(--r);
  padding: 1.3rem 1.4rem; margin-bottom: 1.1rem; box-shadow: var(--shadow);
}
.card h3 { font-size: 16px; font-weight: 600; margin-bottom: .9rem; letter-spacing: -.01em; }

.row { display: flex; gap: .8rem; align-items: flex-end; flex-wrap: wrap; }
.row > * { flex: 1; min-width: 140px; }
.row > .fixed { flex: none; min-width: 0; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: .9rem; }

.pill {
  display: inline-block; font-size: 12px; font-weight: 500;
  padding: .12rem .55rem; border-radius: 999px;
  background: var(--sunken); color: var(--muted);
}
.pill.on { background: var(--good-soft); color: var(--good); }
.pill.off { background: var(--bad-soft); color: var(--bad); }

/* ---------------------------------------------------------------- feedback */
#toast {
  position: fixed; right: 1.4rem; bottom: 1.4rem; max-width: 30rem;
  padding: .85rem 1.1rem; border-radius: var(--r); display: none; z-index: 50;
  background: var(--card); border: 1px solid var(--line);
  box-shadow: 0 8px 30px rgba(0,0,0,.16); white-space: pre-wrap; font-size: 14px;
}
#toast.show { display: block; animation: rise .22s ease; }
#toast.bad { border-color: #f0c8cd; background: var(--bad-soft); color: #8c1520; }
#toast.good { border-color: #c5e6cf; background: var(--good-soft); color: #14612a; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } }

#login { max-width: 23rem; margin: 14vh auto; }
#login .card { padding: 1.9rem; }
#login h2 { text-align: center; }
#login .hint { text-align: center; }
.stack > * + * { margin-top: .9rem; }

#modal {
  position: fixed; inset: 0; background: rgba(0,0,0,.32); backdrop-filter: blur(3px);
  display: flex; align-items: center; justify-content: center; padding: 1.5rem; z-index: 60;
  animation: fade .16s ease;
}
#modal .card {
  max-width: 34rem; width: 100%; max-height: 82vh; overflow: auto; margin: 0;
  box-shadow: 0 20px 60px rgba(0,0,0,.28); animation: pop .18s ease;
}
@keyframes fade { from { opacity: 0; } }
@keyframes pop { from { opacity: 0; transform: scale(.97) translateY(6px); } }

/* ---------------------------------------------------------------- theme editor */
.swatchgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: .9rem; }
.ratio {
  display: flex; justify-content: space-between; align-items: center;
  padding: .5rem 0; border-bottom: 1px solid var(--line-soft); font-size: 14px;
}
.ratio:last-child { border-bottom: none; }
.ratio b { font-weight: 600; }
.ratio b.ok { color: var(--good); }
.ratio b.no { color: var(--bad); }
.preview { border-radius: var(--r-sm); padding: 1.1rem; margin-top: .9rem; }

.artgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; }
.artslot { background: var(--sunken); border-radius: var(--r-sm); padding: .9rem; }
.artslot label { margin-bottom: .1rem; color: var(--text); font-weight: 600; }
.artprev {
  height: 78px; border: 1px solid var(--line); border-radius: 7px; background: #2a2c31;
  display: flex; align-items: center; justify-content: center; overflow: hidden;
}
.artprev img { max-height: 100%; max-width: 100%; object-fit: contain; }
.artprev .none { color: #8b8d93; font-size: 12.5px; }

.widgetrow {
  display: grid; grid-template-columns: 1.1fr 1.2fr 1fr .8fr auto; gap: .6rem;
  align-items: end; margin-bottom: .6rem;
}
.moverow { display: grid; grid-template-columns: 1fr 12rem; gap: .6rem; align-items: center; margin-bottom: .5rem; }

/* The preview is the television's own page in a frame, scaled down. A second
   renderer would drift from the wall it claims to represent. */
.boardwrap {
  position: relative; width: 100%; padding-top: 56.25%; border-radius: var(--r-sm);
  overflow: hidden; border: 1px solid var(--line); background: #000;
}
.boardwrap iframe { position: absolute; inset: 0; width: 1600px; height: 900px; border: 0; transform-origin: 0 0; }

/* A group's crest, shown wherever the group is named. */
/* ---------------------------------------------------------------- home */
/* Cards size to their content. Stretching every card to the tallest in its
   row left a chart with four bars sitting in half a screen of nothing. */
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
         gap: 1.1rem; align-items: start; }
.bars { display: flex; flex-direction: column; gap: .55rem; }
.barrow { display: grid; grid-template-columns: 8.5rem 1fr auto; align-items: center; gap: .7rem; font-size: 14px; }
.barrow .bl { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.barrow .bt { background: var(--sunken); border-radius: 999px; height: 9px; overflow: hidden; }
.barrow .bf { display: block; height: 100%; border-radius: 999px; }
.barrow .bv { font-weight: 600; font-size: 13.5px; }
.donutwrap { display: flex; gap: 1.2rem; align-items: center; flex-wrap: wrap; }
.donutwrap .legend { display: flex; flex-direction: column; gap: .3rem; font-size: 13.5px; }
.donutwrap .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: .45rem; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: .9rem; }
.stat { background: var(--sunken); border-radius: var(--r-sm); padding: .85rem 1rem; }
.stat .k { font-size: 13px; color: var(--muted); margin-bottom: .1rem; }
.stat .v { font-size: 22px; font-weight: 600; letter-spacing: -.02em; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(232px, 1fr)); gap: 1rem; }
.tile {
  background: var(--card); border: 1px solid var(--line-soft); border-radius: var(--r);
  padding: 1.2rem; box-shadow: var(--shadow); cursor: pointer; text-align: left;
  display: flex; flex-direction: column; gap: .45rem; width: 100%;
  transition: transform .12s ease, box-shadow .15s ease, border-color .15s ease;
}
.tile:hover { transform: translateY(-2px); box-shadow: 0 2px 4px rgba(0,0,0,.06), 0 14px 34px rgba(0,0,0,.09); border-color: var(--line); }
.tile:active { transform: translateY(0) scale(.99); }
.tile .ic {
  width: 40px; height: 40px; border-radius: 11px; background: var(--accent-soft);
  color: var(--accent); display: flex; align-items: center; justify-content: center; margin-bottom: .2rem;
}
.tile .ic svg { width: 21px; height: 21px; }
.tile .t { font-size: 16px; font-weight: 600; letter-spacing: -.01em; }
.tile .d { font-size: 13.5px; color: var(--muted); line-height: 1.4; }
.tile .n { margin-top: auto; padding-top: .5rem; font-size: 13px; color: var(--muted); }
.tile .n b { color: var(--text); font-weight: 600; }

.hero-card {
  background: linear-gradient(180deg, #ffffff, #fbfbfd);
  border: 1px solid var(--line-soft); border-radius: var(--r);
  padding: 1.5rem 1.6rem; margin-bottom: 1.2rem; box-shadow: var(--shadow);
  display: flex; align-items: center; justify-content: space-between; gap: 1.5rem; flex-wrap: wrap;
}
.hero-card .big { font-size: 30px; font-weight: 600; letter-spacing: -.02em; }
.tvlist { display: flex; gap: .5rem; flex-wrap: wrap; }

.crest { height: 26px; width: 26px; object-fit: contain; vertical-align: middle; margin-right: .55rem; flex: none; }
.crest.blank { border-radius: 6px; display: inline-block; }
.teamname { display: flex; align-items: center; }
</style>
</head>
<body>

<div id="login" hidden>
  <div class="card stack">
    <h2>Scoreboard</h2>
    <div class="hint">Sign in to manage structure, themes and screens.</div>
    <div><label>Email</label><input id="li-email" type="email" autocomplete="username"></div>
    <div><label>Password</label><input id="li-pass" type="password" autocomplete="current-password"></div>
    <button class="primary" id="li-go" style="width:100%">Sign in</button>
  </div>
</div>

<div class="wrap" id="app" hidden>
  <nav>
    <h1>Scoreboard</h1>
    <div id="nav"></div>
    <div class="who" id="who"></div>
    <button id="passwd" style="margin-top:.6rem">Change password</button>
    <button id="logout" style="margin-top:.3rem">Sign out</button>
  </nav>
  <main id="view"></main>
</div>

<div id="modal" hidden></div>
<div id="toast"></div>

<script>
"use strict";

// ---------------------------------------------------------------- state
const state = {
  token: localStorage.getItem("sb_token") || "",
  me: null,
  tab: "home",
  cache: {},
};

const RANK = { viewer: 0, team_lead: 1, branch_manager: 2, org_admin: 3, owner: 4 };
const can = (minimum) => state.me && RANK[state.me.role] >= RANK[minimum];

const TABS = [
  { key: "home",      label: "Home",      min: "viewer" },
  { key: "board",     label: "Board",     min: "viewer" },
  { key: "groups",    label: "Structure", min: "viewer" },
  { key: "people",    label: "People",    min: "viewer" },
  { key: "theme",     label: "Brand",     min: "team_lead" },
  { key: "screens",   label: "Screens",   min: "viewer" },
  { key: "displays",  label: "Displays",  min: "branch_manager" },
  { key: "access",    label: "Access",    min: "org_admin" },
  { key: "fields",    label: "Metrics",   min: "org_admin" },
  { key: "data",      label: "Data",      min: "org_admin" },
  { key: "audit",     label: "Audit",     min: "org_admin" },
];

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function toast(message, kind) {
  const box = $("toast");
  box.textContent = message;
  box.className = "show " + (kind || "");
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => box.className = "", kind === "bad" ? 9000 : 4000);
}

// Server error details are structured (theme problems, widget problems,
// stranded reps). Flattening them here means every caller gets a message a
// person can act on instead of "[object Object]".
function describe(detail) {
  if (typeof detail === "string") return detail;
  if (Array.isArray(detail)) return detail.map(describe).join("\n");
  if (detail && typeof detail === "object") {
    const parts = [];
    if (detail.error) parts.push(detail.error);
    if (detail.problems) parts.push(...detail.problems.map(p => `• ${p.token}: ${p.message}`));
    if (detail.unassigned) parts.push("Still to move: " + detail.unassigned.map(r => r.name).join(", "));
    if (detail.displays) parts.push("Displays: " + detail.displays.join(", "));
    if (detail.widgets) {
      for (const [index, issues] of Object.entries(detail.widgets)) {
        parts.push(`Widget ${Number(index) + 1}: ${[].concat(issues).join("; ")}`);
      }
    }
    if (detail.msg) parts.push(detail.msg);
    if (parts.length) return parts.join("\n");
  }
  return JSON.stringify(detail);
}

async function api(path, options = {}) {
  const response = await fetch("/api/v1" + path, {
    ...options,
    headers: {
      "Content-Type": "application/json",
      ...(state.token ? { Authorization: "Bearer " + state.token } : {}),
      ...(options.headers || {}),
    },
  });
  const text = await response.text();
  const body = text ? JSON.parse(text) : {};
  if (!response.ok) {
    if (response.status === 401 && state.token) signOut(true);
    throw new Error(describe(body.detail ?? body));
  }
  return body;
}

// ---------------------------------------------------------------- session
async function signIn() {
  try {
    const result = await api("/auth/login", {
      method: "POST",
      body: JSON.stringify({ email: $("li-email").value.trim(), password: $("li-pass").value }),
    });
    state.token = result.token;
    localStorage.setItem("sb_token", result.token);
    await start();
  } catch (error) { toast(error.message, "bad"); }
}

function signOut(expired) {
  state.token = ""; state.me = null;
  localStorage.removeItem("sb_token");
  $("app").hidden = true; $("login").hidden = false;
  if (expired) toast("Session ended. Sign in again.", "bad");
}

async function start() {
  try {
    state.me = await api("/auth/me");
  } catch { return signOut(); }
  $("login").hidden = true; $("app").hidden = false;
  $("who").innerHTML =
    `<div><b>${esc(state.me.user.email)}</b></div>` +
    `<div>${esc(state.me.organization?.name || "")}</div>` +
    `<div class="pill">${esc(state.me.role)}</div>`;

  const visible = TABS.filter(t => can(t.min));
  // A single group's page is reached from the Structure list, not a
  // destination of its own, so it never appears in the sidebar but must not
  // be reset either.
  if (state.tab !== "group" && !visible.some(t => t.key === state.tab)) {
    state.tab = visible[0].key;
  }
  $("nav").innerHTML = visible
    .map(t => `<button data-tab="${t.key}" class="${
        t.key === state.tab || (state.tab === "group" && t.key === "groups") ? "on" : ""
      }">${t.label}</button>`)
    .join("");
  $("nav").querySelectorAll("button").forEach(b =>
    b.onclick = () => { state.tab = b.dataset.tab; start(); });

  render();
}

// ---------------------------------------------------------------- helpers
const fmt = (value, kind) => {
  const n = Number(value) || 0;
  if (kind === "currency") return "$" + Math.round(n).toLocaleString("en-US");
  if (kind === "percent") return n.toFixed(1) + "%";
  if (kind === "number") return Math.round(n).toLocaleString("en-US");
  return String(value ?? "");
};

function section(title, hint, html) {
  $("view").innerHTML = `<h2>${esc(title)}</h2><div class="hint">${hint}</div>${html}`;
}

const onClick = (selector, handler) =>
  $("view").querySelectorAll(selector).forEach(node => node.onclick = () => handler(node));

// Replaces window.prompt and window.confirm. Beyond being unstyled and
// unable to validate, both are blocked outright in some embedded browsers,
// where a delete button would silently do nothing at all.
function dialog(title, bodyHtml, onConfirm, confirmLabel = "Save") {
  const host = $("modal");
  host.innerHTML = `<div class="card">
      <h3>${esc(title)}</h3>
      <div id="dlg-body" class="stack">${bodyHtml}</div>
      <div class="row" style="margin-top:1rem;justify-content:flex-end">
        <div class="fixed"><button id="dlg-cancel">Cancel</button></div>
        <div class="fixed"><button class="primary" id="dlg-ok">${esc(confirmLabel)}</button></div>
      </div>
    </div>`;
  host.hidden = false;

  const close = () => { host.hidden = true; host.innerHTML = ""; document.removeEventListener("keydown", onKey); };
  const onKey = (e) => { if (e.key === "Escape") close(); };
  document.addEventListener("keydown", onKey);
  $("dlg-cancel").onclick = close;
  host.onclick = (e) => { if (e.target === host) close(); };
  $("dlg-ok").onclick = async () => {
    try { await onConfirm(close); }
    catch (error) { toast(error.message, "bad"); }
  };
  const first = host.querySelector("input, select");
  if (first) first.focus();
}

function confirmAsync(message, confirmLabel = "Yes, do it") {
  return new Promise(resolve => {
    let answered = false;
    dialog("Please confirm",
      `<div class="hint" style="white-space:pre-line">${esc(message)}</div>`,
      async (close) => { answered = true; close(); resolve(true); }, confirmLabel);
    // Cancelling, pressing Escape or clicking away all mean "no".
    const host = $("modal");
    const observer = new MutationObserver(() => {
      if (host.hidden && !answered) { observer.disconnect(); resolve(false); }
    });
    observer.observe(host, { attributes: true, attributeFilter: ["hidden"] });
  });
}

async function guard(action) {
  try { await action(); } catch (error) { toast(error.message, "bad"); }
}

// ---------------------------------------------------------------- views
const views = {};

// Line icons, drawn inline. Four external requests for four small pictures is
// four things that can fail on a machine with no internet, which is where
// some of these installations live.
const ICONS = {
  board: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-7"/></svg>',
  groups: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"/></svg>',
  people: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5"/><path d="M16 5.2a3.2 3.2 0 010 5.6M18 14.9c2 .7 3.5 2.5 3.5 5.1"/></svg>',

// Charts drawn as inline SVG. The same numbers the television gets, from the
// same builder, so a group page can never quietly disagree with the wall.
function chartBar(widget, colour, colours) {
  const series = widget.series || [];
  if (!series.length) return `<div class="hint">Nothing to show yet.</div>`;
  const max = Math.max(...series.map(s => s.value), 1);
  return `<div class="bars">${series.map((s, i) => `
    <div class="barrow">
      <span class="bl">${esc(s.label)}</span>
      <span class="bt"><span class="bf" style="width:${Math.max(s.value / max * 100, 1.5).toFixed(1)}%;background:${
        (colours && colours[i]) || colour || "#0071e3"}"></span></span>
      <span class="bv">${fmt(s.value, widget.unit)}</span>
    </div>`).join("")}</div>`;
}

function chartDonut(widget, palette) {
  const series = widget.series || [];
  const total = series.reduce((sum, s) => sum + s.value, 0);
  if (!total) return `<div class="hint">Nothing sold yet this period.</div>`;

  const r = 42, c = 2 * Math.PI * r;
  let offset = 0;
  const arcs = series.map((s, i) => {
    const fraction = s.value / total;
    const arc = `<circle cx="60" cy="60" r="${r}" fill="none" stroke="${palette[i % palette.length]}"
        stroke-width="20" stroke-dasharray="${(fraction * c).toFixed(2)} ${c.toFixed(2)}"
        stroke-dashoffset="${(-offset * c).toFixed(2)}" transform="rotate(-90 60 60)"/>`;
    offset += fraction;
    return arc;
  }).join("");

  return `<div class="donutwrap">
    <svg viewBox="0 0 120 120" width="128" height="128">${arcs}</svg>
    <div class="legend">${series.map((s, i) => `
      <div><i style="background:${palette[i % palette.length]}"></i>${esc(s.label)}
        <span class="hint" style="margin:0">${(s.value / total * 100).toFixed(0)}%</span></div>`).join("")}
    </div></div>`;
}

function sparkline(points, colour) {
  if (!points || points.length < 2) {
    return `<div class="hint">One capture so far &mdash; a trend needs a second day.</div>`;
  }
  const values = points.map(p => Number(p.value) || 0);
  const min = Math.min(...values), max = Math.max(...values), span = (max - min) || 1;
  const coords = values.map((v, i) => `${(i / (values.length - 1) * 100).toFixed(2)},${(38 - (v - min) / span * 34).toFixed(2)}`);
  return `<svg viewBox="0 0 100 40" preserveAspectRatio="none" style="width:100%;height:70px">
    <polyline points="${coords.join(" ")}" fill="none" stroke="${colour}" stroke-width="1.8" vector-effect="non-scaling-stroke"/>
  </svg>`;
}

views.groups = async () => {
  const [{ group_types }, { groups }, { reps }, { themes }] = await Promise.all([
    api("/group-types"), api("/groups"), api("/reps"), api("/themes")]);

  // Which axis is being looked at. Kept in state so coming back from a group
  // page lands where you left rather than snapping back to teams.
  const axis = group_types.find(t => t.key === state.axis) || group_types[0];
  if (!axis) return section("Structure", "This organization has no groupings yet.", "");
  state.axis = axis.key;

  const mine = groups.filter(g => g.type_id === axis.id);
  const parents = group_types.filter(t => t.id !== axis.id);
  const parentGroups = groups.filter(g => g.type_id !== axis.id);
  state.cache.groups = groups;

  // Count who is *shown* in the group, not only who was moved there by hand.
  // Most people arrive through the source and are never reassigned; reporting
  // them as zero members beside a board that plainly shows them is the console
  // contradicting itself.
  const shown = (g) => reps.filter(r => (r.groups[axis.key] || {}).name === g.name).length;
  const moved = (g) => reps.filter(r => (r.groups[axis.key] || {}).group_id === g.id).length;
  const editable = state.me.editable_group_ids;
  const mayEdit = (id) => editable === null || (editable || []).includes(id);

  const tabs = group_types.map(t =>
    `<button class="sm ${t.id === axis.id ? "primary" : ""}" data-axis="${esc(t.key)}">

     </button>`).join("");

  section("Structure",

      ${parents.length ? `<div><label>Inside</label><select id="t-parent">

    <div class="card"><table>

      <div><label>Name of one</label><input id="gt-label" placeholder="Region"></div>
      <div><label>Name of many</label><input id="gt-plural" placeholder="Regions"></div>`,
      async (close) => {
        const label = $("gt-label").value.trim();
        if (!label) throw new Error("A grouping needs a name.");
        const made = await api("/group-types", { method: "POST", body: JSON.stringify({
          label, plural_label: $("gt-plural").value.trim() }) });
        state.axis = made.key;
        close(); toast("Grouping added", "good"); render();
      });

    $("gt-rename").onclick = () => dialog(`Rename ${axis.plural_label}`, `
      <div><label>Name of one</label><input id="gt-label" value="${esc(axis.label)}"></div>
      <div><label>Name of many</label><input id="gt-plural" value="${esc(axis.plural_label)}"></div>`,
      async (close) => {
        await api(`/group-types/${axis.id}`, { method: "PATCH", body: JSON.stringify({
          label: $("gt-label").value.trim(), plural_label: $("gt-plural").value.trim() }) });
        close(); toast("Saved", "good"); render();
      });

    if (!axis.is_primary) $("gt-primary").onclick = () => guard(async () => {
      await api(`/group-types/${axis.id}/primary`, { method: "POST" });
      toast(`Boards now group by ${axis.plural_label.toLowerCase()}`, "good"); render();
    });

    if (!axis.is_builtin) $("gt-del").onclick = () => dialog(`Remove ${axis.plural_label}`,
      `<div class="hint">This removes the grouping and every ${esc(axis.label.toLowerCase())} in it.
        Nobody is deleted &mdash; people simply stop being grouped this way.</div>`,
      async (close) => {
        await api(`/group-types/${axis.id}/delete`, { method: "POST" });
        state.axis = null;
        close(); toast("Grouping removed", "good"); render();
      }, "Remove");
  }

  if (can("branch_manager")) $("t-add").onclick = () => guard(async () => {
    const parent = $("t-parent");
    await api("/groups", { method: "POST", body: JSON.stringify({
      type_id: axis.id,
      name: $("t-name").value.trim(),
      lead_name: $("t-lead").value.trim(),
      lead_role: $("t-role").value,
      parent_id: parent && parent.value ? Number(parent.value) : null }) });
    toast(`${axis.label} created`, "good"); render();
  });

  const ROLES = ["Sales Manager", "SMIT", "General Manager", "Other"];

  onClick("[data-edit]", node => {
    const group = mine.find(t => t.id === Number(node.dataset.edit));
    dialog(`Edit ${group.name}`, `
      <div><label>Name</label><input id="e-name" value="${esc(group.name)}"></div>
      <div><label>Lead</label><input id="e-lead" value="${esc(group.lead_name)}"></div>
      <div><label>Lead role</label><select id="e-role">${ROLES.map(r =>
        `<option ${r === group.lead_role ? "selected" : ""}>${r}</option>`).join("")}</select></div>
      ${can("org_admin") && parentGroups.length ? `<div><label>Inside</label><select id="e-parent">
        <option value="">&mdash; nothing &mdash;</option>
        ${parentGroups.map(g => `<option value="${g.id}" ${g.id === group.parent_id ? "selected" : ""}>${esc(g.name)}</option>`).join("")}
      </select></div>` : ""}`,
      async (close) => {
        const name = $("e-name").value.trim();
        if (!name) throw new Error("A group needs a name.");
        const parent = $("e-parent");
        await api(`/groups/${group.id}`, { method: "PATCH", body: JSON.stringify({
          type_id: axis.id, name, lead_name: $("e-lead").value.trim(),
          lead_role: $("e-role").value,
          parent_id: parent ? (parent.value ? Number(parent.value) : null) : group.parent_id }) });
        close(); toast("Saved", "good"); render();
      });
  });

  onClick("[data-del]", node => {
    const id = Number(node.dataset.del);
    const group = mine.find(t => t.id === id);
    // Only people moved here by hand have a membership to redirect. Anyone
    // showing here through the source keeps showing wherever the source says.
    const members = reps.filter(r => (r.groups[axis.key] || {}).group_id === id
                                     && !(r.groups[axis.key] || {}).inherited);
    const options = mine.filter(t => t.id !== id);

    dialog(`Delete ${group.name}`, members.length
      ? `<div class="hint">Every member needs somewhere to go. Deleting a group never deletes people.</div>
         ${members.map(m => `<div class="moverow">
           <span>${esc(m.name)}</span>
           <select data-move="${m.id}">
             <option value="">&mdash; Unassigned &mdash;</option>
             ${options.map(t => `<option value="${t.id}">${esc(t.name)}</option>`).join("")}
           </select></div>`).join("")}`
      : `<div class="hint">Nobody was moved into this group by hand. It can be removed straight away.</div>`,
      async (close) => {
        const reassign = {};
        $("modal").querySelectorAll("[data-move]").forEach(select => {
          reassign[Number(select.dataset.move)] = select.value ? Number(select.value) : null;
        });
        await api(`/groups/${id}/delete`, { method: "POST", body: JSON.stringify({ reassign }) });
        close(); toast("Deleted", "good"); render();
      }, "Delete");
  });
};

views.people = async () => {
  const [{ reps, group_types, primary_type }, { groups }] = await Promise.all([
    api("/reps"), api("/groups")]);

  // People are placed on one axis at a time. Showing five dropdowns per row
  // turns a table into a form; showing one, with a chooser above it, keeps the
  // page readable and the action obvious.
  const axis = group_types.find(t => t.key === state.peopleAxis)
            || group_types.find(t => t.key === primary_type)
            || group_types[0];
  if (!axis) return section("People", "This organization has no groupings yet.", "");
  state.peopleAxis = axis.key;
  const options = groups.filter(g => g.type_id === axis.id);

  const tabs = group_types.map(t =>
    `<button class="sm ${t.id === axis.id ? "primary" : ""}" data-paxis="${esc(t.key)}">
       ${esc(t.plural_label)}</button>`).join("");

  const placed = (r) => r.groups[axis.key] || null;

  section("People",
    "A local assignment outranks whatever the source reports, and survives every refresh.",
    `<div class="card"><div class="tvlist">${tabs}</div>
       <div class="hint" style="margin:.6rem 0 0">Placing somebody by ${esc(axis.label.toLowerCase())}.
         A group inside another passes down: put someone on a team and their branch follows.</div></div>
    <div class="card"><table>
      <thead><tr><th class="l">Name</th><th class="l">${esc(axis.label)}</th>
        <th class="l">Source says</th><th class="l">Title</th><th></th></tr></thead>
      <tbody>${reps.map(r => {
        const here = placed(r);
        return `<tr>
        <td class="l"><b>${esc(r.name)}</b></td>
        <td class="l">${here ? esc(here.name) : "&mdash;"} ${
          !here ? ""
            : here.source ? '<span class="pill">from source</span>'
            : here.inherited ? '<span class="pill">inherited</span>'
            : '<span class="pill on">local</span>'}</td>
        <td class="l">${esc(r.source_team) || "&mdash;"}</td>
        <td class="l">${esc(r.title) || "&mdash;"}</td>
        <td>${can("branch_manager") ? `<select data-assign="${r.id}" style="width:auto">
          <option value="">&mdash; use source &mdash;</option>
          ${options.map(t => `<option value="${t.id}" ${
            here && !here.inherited && !here.source && t.id === here.group_id ? "selected" : ""
          }>${esc(t.name)}</option>`).join("")}
        </select>` : ""}</td>
      </tr>`; }).join("")}</tbody>
    </table></div>`);

  onClick("[data-paxis]", node => { state.peopleAxis = node.dataset.paxis; render(); });

  $("view").querySelectorAll("[data-assign]").forEach(select => {
    select.onchange = () => guard(async () => {
      await api(`/reps/${select.dataset.assign}/group`, { method: "POST",
        body: JSON.stringify({
          type_id: axis.id,
          group_id: select.value ? Number(select.value) : null }) });
      toast("Assignment saved", "good"); render();
    });
  });
};

views.theme = async () => {
  const [catalogue, { themes }, { groups, group_types }] = await Promise.all([
    api("/themes/catalogue"), api("/themes"), api("/groups")]);
  const editable = state.me.editable_group_ids;
  const kindOf = (id) => group_types.find(t => t.id === id);
  const targets = [
    ...(can("org_admin") ? [{ value: "org", label: "Whole organization" }] : []),
    ...groups.filter(g => editable === null || (editable || []).includes(g.id))
             .map(g => ({
               value: "group:" + g.id,
               // Prefixed with its grouping, because two axes may hold the
               // same name and a bare "North" in a dropdown says nothing.
               label: `${kindOf(g.type_id)?.label || "Group"} \u00b7 ${g.name}`,
               name: g.name,
               axis: kindOf(g.type_id)?.key || "",
             })),
  ];
  if (!targets.length) return section("Theme", "You have no group to style.", "");

  const tokens = { ...catalogue.defaults };
  section("Brand", "Colours, artwork and a font &mdash; never CSS. A theme that would be unreadable on a screen is refused, not saved with a warning. Each group can carry its own; anything it does not set is inherited from the organization.", `
    <div class="card">
      <div class="row">
        <div><label>Applies to</label><select id="th-target">${targets.map(t =>
          `<option value="${t.value}">${esc(t.label)}</option>`).join("")}</select></div>
        <div><label>Name</label><input id="th-name" value="Brand"></div>
        <div><label>Font</label><select id="th-font">${catalogue.fonts.map(f =>
          `<option value="${f.key}">${f.key}</option>`).join("")}</select></div>
      </div>
      <div class="swatchgrid" style="margin-top:1rem">${catalogue.color_tokens.map(key =>
        `<div><label>${key}</label><input type="color" data-tok="${key}" value="${tokens[key]}"></div>`).join("")}</div>
      <div class="row" style="margin-top:1rem">
        <div><label>Frame</label><select id="th-frame">${catalogue.frames.map(f =>
          `<option value="${f}">${f}</option>`).join("")}</select></div>
        <div><label>Background dim %</label><input data-tok="background_dim" type="number" min="0" max="90" value="55"></div>
        <div class="fixed"><button class="primary" id="th-save">Save theme</button></div>
      </div>

      <h3 style="margin-top:1.2rem">Artwork</h3>
      <div class="artgrid">
        ${[["hero_url", "Hero banner", "the big crest across the top"],
           ["badge_url", "Group badge", "the small mark beside each rep"],
           ["logo_url", "Header logo", "a modest mark, if no hero"],
           ["background_image_url", "Background", "texture behind the board"]]
          .map(([token, label, note]) => `<div class="artslot">
            <label>${label}</label>
            <div class="hint" style="margin:0 0 .4rem">${note}</div>
            <div class="artprev" id="prev-${token}"></div>
            <input data-tok="${token}" placeholder="paste a URL" style="margin-top:.4rem">
            <input type="file" data-upload="${token}" accept="image/png,image/jpeg,image/webp,image/gif" style="margin-top:.3rem">
          </div>`).join("")}
      </div>
      <div class="hint" id="th-art-note" style="margin:.5rem 0 0"></div>
    </div>
    <div class="card"><h3>Readability</h3><div id="th-ratios"></div>
      <div class="preview" id="th-prev"></div></div>
    <div class="card"><h3>On the television</h3>
      <div class="hint">The board's own page, scaled down. Updates when you save.</div>
      <div class="boardwrap" id="th-board"></div></div>`);

  const readTokens = () => {
    const values = { font: $("th-font").value, frame: $("th-frame").value };
    $("view").querySelectorAll("[data-tok]").forEach(input => {
      if (input.value) values[input.dataset.tok] = input.value;
    });
    return values;
  };

  const refresh = () => guard(async () => {
    const current = readTokens();
    const report = await api("/themes/preview", { method: "POST", body: JSON.stringify({ tokens: current }) });
    const minimums = { text_on_background: catalogue.minimums.text, text_on_surface: catalogue.minimums.text,
                       muted_on_background: catalogue.minimums.secondary, accent_on_surface: catalogue.minimums.accent };
    $("th-ratios").innerHTML = Object.entries(report.ratios).map(([key, ratio]) => {
      const ok = ratio >= minimums[key];
      return `<div class="ratio"><span>${key.replace(/_/g, " ")}</span>
        <b class="${ok ? "ok" : "no"}">${ratio.toFixed(2)}:1 ${ok ? "✓" : "needs " + minimums[key].toFixed(2)}</b></div>`;
    }).join("") + (report.problems.length
      ? `<div style="color:#ff9a92;margin-top:.6rem">${report.problems.map(p => esc(p.message)).join("<br>")}</div>`
      : `<div style="color:#7ee2a8;margin-top:.6rem">Readable across a room.</div>`);

    const r = report.resolved;
    $("th-prev").style.cssText =
      `background:${r.background};color:${r.text};font-family:${report.font_stack}`;
    $("th-prev").innerHTML =
      (r.logo_url ? `<img src="${esc(r.logo_url)}" alt="" style="max-height:44px;margin-bottom:.5rem">` : "") +
      `<div style="font-size:26px;font-weight:800">SALES LEADERBOARD</div>
       <div style="color:${r.muted};letter-spacing:.1em;font-size:12px">SECONDARY TEXT</div>
       <div style="background:${r.surface};border-top:4px solid ${r.primary};padding:.7rem;margin-top:.7rem;border-radius:6px">
         <span style="color:${r.accent};font-weight:800;font-size:22px">$412,900</span>
         <span style="color:${r.muted}"> &nbsp;NET SPLIT</span></div>`;
  });

  // A scaled iframe of the real board. It reflects saved themes, so it
  // updates after Save rather than while colours are still being tried —
  // which is what the contrast panel above is for.
  function drawBoard() {
    const target = $("th-target").value;
    const chosen = targets.find(t => t.value === target);
    const query = chosen && chosen.name
      ? `?mode=per_group&group_by=${encodeURIComponent(chosen.axis)}` +
        `&group=${encodeURIComponent(chosen.name)}` +
        `&title=${encodeURIComponent(chosen.name.toUpperCase())}`
      : "?mode=whole_office";
    const wrap = $("th-board");
    wrap.innerHTML = `<iframe src="/preview/live${query}" title="Board preview"></iframe>`;
    const scale = () => {
      const frame = wrap.querySelector("iframe");
      if (frame) frame.style.transform = `scale(${wrap.clientWidth / 1600})`;
    };
    scale();
    setTimeout(scale, 60);
  }

  function drawArtwork() {
    $("view").querySelectorAll("[data-tok]").forEach(input => {
      const slot = $("prev-" + input.dataset.tok);
      if (!slot) return;
      slot.innerHTML = input.value
        ? `<img src="${esc(input.value)}" alt="">`
        : `<span class="none">nothing set</span>`;
    });
  }

  $("view").querySelectorAll("[data-tok], #th-font, #th-frame").forEach(input => {
    input.oninput = () => { refresh(); drawArtwork(); };
  });
  $("th-target").onchange = () => {
    const target = $("th-target").value;
    const found = target === "org"
      ? themes.find(t => t.scope === "org")
      : themes.find(t => t.scope === "group" && t.group_id === Number(target.split(":")[1]));
    const merged = { ...catalogue.defaults, ...(found?.tokens || {}) };
    $("th-name").value = found?.name || "Brand";
    $("th-font").value = merged.font || "inter";
    $("th-frame").value = merged.frame || "none";
    $("view").querySelectorAll("[data-tok]").forEach(i => {
      i.value = merged[i.dataset.tok] ?? "";
    });
    refresh(); drawArtwork(); drawBoard();
  };
  // Arriving from a group's Theme button preselects that group, so the editor
  // opens on the thing that was clicked.
  if (state.themeTarget && targets.some(t => t.value === state.themeTarget)) {
    $("th-target").value = state.themeTarget;
  }
  state.themeTarget = null;
  $("th-target").onchange();

  $("view").querySelectorAll("[data-upload]").forEach(input => input.onchange = () => guard(async () => {
    const token = input.dataset.upload;
    const file = input.files[0];
    if (!file) return;
    $("th-art-note").textContent = "Uploading…";
    // Sent as multipart rather than a data URL: the server decides what the
    // file is from its own bytes, and a base64 blob in a theme token would
    // travel with every board refresh.
    const body = new FormData();
    body.append("file", file);
    const response = await fetch("/api/v1/assets", {
      method: "POST", body, headers: { Authorization: "Bearer " + state.token },
    });
    const result = await response.json();
    if (!response.ok) { $("th-art-note").textContent = ""; throw new Error(describe(result.detail)); }
    $("view").querySelector(`[data-tok="${token}"]`).value = result.url;
    $("th-art-note").textContent =
      `Uploaded ${result.filename} (${Math.round(result.size_bytes / 1024)}KB). Save the theme to put it on the board.`;
    refresh();
  }));

  $("th-save").onclick = () => guard(async () => {
    const target = $("th-target").value;
    const path = target === "org" ? "/themes/org" : `/themes/group/${target.split(":")[1]}`;
    await api(path, { method: "PUT", body: JSON.stringify({ name: $("th-name").value, tokens: readTokens() }) });
    toast("Theme saved", "good");
    drawBoard();
  });

  window.addEventListener("resize", drawBoard);
};

views.screens = async () => {
  const [{ screens }, charts, { groups, group_types }] = await Promise.all([
    api("/screens"), api("/charts/catalogue"), api("/groups")]);
  state.cache.charts = charts;
  const modes = ["whole_office", "per_group", "group_vs_group", "all_groups"];
  const primary = group_types.find(t => t.is_primary) || group_types[0];
  // A screen picks the axis it is organized along; every mode below then
  // means "per that", so one set of modes covers every grouping.
  const inAxis = (key) => {
    const kind = group_types.find(t => t.key === key);
    return kind ? groups.filter(g => g.type_id === kind.id) : [];
  };

  section("Screens", "What a television shows. Preview here before anyone sees it on a wall.", `
    ${can("branch_manager") ? `<div class="card"><h3>New screen</h3>
      <div class="row">
        <div><label>Name</label><input id="s-name" placeholder="Front office TV"></div>
        <div><label>Mode</label><select id="s-mode">${modes.map(m => `<option>${m}</option>`).join("")}</select></div>
        <div><label>Title on screen</label><input id="s-title" value="SALES LEADERBOARD"></div>
        <div><label>Rank by</label><select id="s-rank">${charts.metrics.map(m =>
          `<option value="${m.key}" ${m.key === "net_split" ? "selected" : ""}>${esc(m.label)}</option>`).join("")}</select></div>
        <div><label>Group by</label><select id="s-axis">${group_types.map(t =>
          `<option value="${esc(t.key)}" ${t.id === (primary || {}).id ? "selected" : ""}>${esc(t.plural_label)}</option>`).join("")}</select></div>
      </div>
      <div id="s-groups" class="row" style="margin-top:.7rem" hidden></div>
      <h3 style="margin-top:1.1rem">Widgets</h3>
      <div id="s-widgets"></div>
      <div class="row" style="margin-top:.6rem">
        <div class="fixed"><button id="s-addw">Add widget</button></div>
        <div class="fixed"><button class="primary" id="s-create">Create screen</button></div>
      </div></div>` : ""}
    <div class="card"><table>
      <thead><tr><th class="l">Screen</th><th class="l">Mode</th><th>Widgets</th><th></th></tr></thead>
      <tbody>${screens.map(s => `<tr>
        <td class="l"><b>${esc(s.name)}</b></td><td class="l">${esc(s.mode)}</td>
        <td>${(s.config.widgets || []).length}</td>
        <td><button class="sm" data-prev="${s.id}">Preview</button>
            ${can("branch_manager") ? `<button class="sm danger" data-delscreen="${s.id}">Delete</button>` : ""}</td>
      </tr>`).join("") || `<tr><td class="l" colspan="4">No screens yet.</td></tr>`}</tbody>
    </table></div>
    <div id="s-preview"></div>`);

  if (can("branch_manager")) {
    const widgetRow = () => {
      const row = document.createElement("div");
      row.className = "widgetrow";
      row.innerHTML = `
        <div><label>Chart</label><select class="w-type">${charts.charts.map(c =>
          `<option value="${c.key}">${esc(c.label)}</option>`).join("")}</select></div>
        <div><label>Metric</label><select class="w-metric">${charts.metrics.map(m =>
          `<option value="${m.key}">${esc(m.label)}</option>`).join("")}</select></div>
        <div><label>Group by</label><select class="w-group">
          <option value="group">Whatever the board groups by</option>
          <option value="rep">Rep</option>
          ${group_types.map(t => `<option value="${esc(t.key)}">${esc(t.plural_label)}</option>`).join("")}
        </select></div>
        <div><label>Target</label><input class="w-target" type="number" placeholder="—"></div>
        <div class="fixed"><button class="sm danger w-del">✕</button></div>`;
      row.querySelector(".w-del").onclick = () => row.remove();
      return row;
    };
    $("s-addw").onclick = () => $("s-widgets").appendChild(widgetRow());
    $("s-widgets").appendChild(widgetRow());

    const groupPicker = () => {
      const mode = $("s-mode").value;
      const axis = $("s-axis").value;
      const kind = group_types.find(t => t.key === axis) || {};
      const options = inAxis(axis).map(g => `<option>${esc(g.name)}</option>`).join("");
      const box = $("s-groups");
      box.hidden = !(mode === "per_group" || mode === "group_vs_group");
      box.innerHTML = mode === "per_group"
        ? `<div><label>${esc(kind.label || "Group")}</label><select id="s-group">${options}</select></div>`
        : mode === "group_vs_group"
        ? `<div><label>${esc(kind.label || "Group")} 1</label><select id="s-t1">${options}</select></div>
           <div><label>${esc(kind.label || "Group")} 2</label><select id="s-t2">${options}</select></div>`
        : "";
    };
    $("s-mode").onchange = groupPicker;
    $("s-axis").onchange = groupPicker;
    groupPicker();

    $("s-create").onclick = () => guard(async () => {
      const widgets = [...$("s-widgets").children].map(row => {
        const widget = {
          type: row.querySelector(".w-type").value,
          metric: row.querySelector(".w-metric").value,
          group_by: row.querySelector(".w-group").value,
        };
        const target = row.querySelector(".w-target").value;
        if (target) widget.target = Number(target);
        return widget;
      });
      const mode = $("s-mode").value;
      const config = {
        title: $("s-title").value, rank_by: $("s-rank").value,
        group_by: $("s-axis").value, widgets,
      };
      if (mode === "per_group") config.group = $("s-group").value;
      if (mode === "group_vs_group") config.groups = [$("s-t1").value, $("s-t2").value];
      await api("/screens", { method: "POST", body: JSON.stringify({ name: $("s-name").value.trim(), mode, config }) });
      toast("Screen created", "good"); render();
    });
  }

  onClick("[data-prev]", node => guard(async () => {
    const id = node.dataset.prev;
    // Show the television's own page rather than a summary of its numbers.
    // A preview drawn separately drifts, and then it is showing something
    // nobody will ever see on a wall.
    const data = await api(`/screens/${id}/render`);
    $("s-preview").innerHTML = `<div class="card">
      <h3>${esc(data.screen.title)} &mdash; exactly what the television shows</h3>
      <div class="boardwrap" id="s-frame"><iframe src="/preview/screen/${id}" title="Board preview"></iframe></div>

       </div>`);
  }));

// Fields the platform understands, and the words a person filling in the
// mapping screen would use for them.
const MAPPABLE = [
  ["rep_name", "Name", "required"],
  ["rep_key", "Unique id", "falls back to the name"],
  ["group", "Group", ""],
  ["home_branch", "Branch or office", ""],
  ["title", "Job title", ""],
  ["issued_leads", "Issued leads", ""],
  ["pitched_leads", "Pitched leads", ""],
  ["sold_leads", "Sold leads", ""],
  ["gross_split", "Gross", ""],
  ["pending_split", "Pending", ""],
  ["net_split", "Net", ""],
];

// A first guess, so most of the form is already filled in. Wrong guesses are
// visible and one click to change; an empty form is eleven decisions.
function guessField(target, fields) {
  const norm = (s) => String(s).toLowerCase().replace(/[^a-z]/g, "");
  const wanted = {
    rep_name: ["name", "fullname", "rep", "salesrep", "employee"],
    rep_key: ["id", "employeeid", "repid", "code", "key"],
    group: ["team", "crew", "squad", "group"],
    home_branch: ["branch", "office", "location", "market"],
    title: ["title", "role", "position"],
    issued_leads: ["issued", "leadsissued", "issuedleads", "assigned"],
    pitched_leads: ["pitched", "leadspitched", "pitchedleads", "presented"],
    sold_leads: ["sold", "deals", "closed", "sales", "soldleads"],
    gross_split: ["gross", "grosssplit", "grosssales", "revenue"],
    pending_split: ["pending", "pendingsplit"],
    net_split: ["net", "netsplit", "netsales"],
  }[target] || [];

  for (const candidate of wanted) {
    const hit = fields.find(f => norm(f.field) === candidate);
    if (hit) return hit.field;
  }
  for (const candidate of wanted) {
    const hit = fields.find(f => norm(f.field).includes(candidate));
    if (hit) return hit.field;
  }
  return "";
}

views.fields = async () => {

  const shape = (f) => f.role === "derived"
    ? f.expression
      ? `<span class="pill"><code>${esc(f.expression)}</code></span>`
      : `<span class="pill">${esc(label(f.numerator))} &divide; ${esc(label(f.denominator))}${
          f.scale !== 1 ? ` &times; ${f.scale}` : ""}</span>`
    : f.role === "additive"
    ? `<span class="pill on">from the source</span>`
    : `<span class="pill">${esc(f.role)}</span>`;

  section("Metrics", "What this company measures. A stored value comes from your source and is added up; a calculated one carries its formula and is worked out fresh at every level &mdash; so a group total can never disagree with the rows above it.", `
    ${using_defaults ? `<div class="card"><b>Using the standard set.</b>
      <div class="hint" style="margin:.3rem 0 0">Adding or changing anything copies these in first, and they become yours.</div></div>` : ""}

        <div><label>Kind</label><select id="f-role">
          <option value="additive">Stored &mdash; your source sends it</option>
          <option value="derived">Calculated &mdash; worked out from the others</option>
        </select></div>
        <div><label>Shown as</label><select id="f-kind">${kinds.filter(k => k !== "system" && k !== "text")
          .map(k => `<option value="${k}">${k}</option>`).join("")}</select></div>
      </div>
      <div id="f-formula" style="margin-top:.7rem" hidden>
        <div class="tvlist" style="margin-bottom:.7rem">
          <button class="sm primary" id="f-simple">One divided by another</button>
          <button class="sm" id="f-free">Write the arithmetic</button>
        </div>

        <div class="row" id="f-ratio">
          <div><label>Divide this</label><select id="f-num">${fields.filter(f => f.role !== "text" && f.role !== "system")
            .map(f => `<option value="${esc(f.key)}">${esc(f.label)}</option>`).join("")}</select></div>
          <div><label>By this</label><select id="f-den">${fields.filter(f => f.role !== "text" && f.role !== "system")

          <div><label>Multiply by</label><input id="f-scale" type="number" step="any" value="100"></div>

          <div class="hint" style="margin:.5rem 0 0">
            Arithmetic over the fields below. <code>+ - * / ( )</code>, and
            <code>${functions.map(esc).join("</code>, <code>")}</code>.
            A threshold is written <code>a if b &gt;= 10 else c</code>.

          <div class="hint" style="margin:.4rem 0 0">

    if (!$("f-expression").value.trim()) {

    short_label: $("f-short").value.trim(),
    kind: $("f-kind").value,

  });

    const sample = result.sample;
    $("f-note").innerHTML = sample
      ? `<b>${fmt(sample.office, $("f-kind").value)}</b> across the office. ${esc(result.note)}<br>` +
        sample.people.map(p => `${esc(p.name)}: ${fmt(p.value, $("f-kind").value)}`).join(" &middot; ")
      : esc(result.note);
  });

  $("f-add").onclick = () => guard(async () => {
    await api("/fields", { method: "POST", body: JSON.stringify(body()) });
    toast("Metric added", "good"); render();

  onClick("[data-rename]", node => dialog("Rename metric",

     <div class="hint">The key stays the same, so screens and stored figures keep working.</div>`,

      await api(`/fields/${current.id}`, { method: "PATCH", body: JSON.stringify({
        ...current, label: $("rn").value.trim() }) });
      close(); toast("Renamed", "good"); render();

  onClick("[data-fdel]", node => guard(async () => {

Stored figures for it stay in the database but stop appearing.`, "Delete")) return;

        <td class="l"><b>${esc(s.name)}</b> ${s.has_secret ? '<span class="pill on">secret set</span>' : ""}
          ${Object.keys(s.config.mapping || {}).length
            ? `<span class="pill">${Object.keys(s.config.mapping).length} fields mapped</span>`
            : (kinds[s.kind]?.pullable && s.kind !== "mock" ? '<span class="pill off">not mapped</span>' : "")}</td>
        <td class="l">${esc(kinds[s.kind]?.label || s.kind)}</td>
        <td class="l">${s.last_run_at ? esc(s.last_run_at.slice(0, 16).replace("T", " ")) : "never"}</td>
        <td class="l">${esc(s.last_status)}</td>
        <td>${s.kind === "rest" ? `<button class="sm" data-map="${s.id}">Map fields</button>` : ""}
            <button class="sm" data-test="${s.id}">Test</button>
            <button class="sm" data-refresh="${s.id}">Refresh</button>
            <button class="sm danger" data-delsrc="${s.id}">Delete</button></td>
      </tr>`).join("") || `<tr><td class="l" colspan="5">No sources yet.</td></tr>`}</tbody>
    </table></div>

    <div class="card"><h3>Ingest API keys</h3>
      <div class="hint" style="margin-bottom:.8rem">For a system we cannot reach: their IT posts rows to
        <code>POST /api/v1/ingest/reps</code> with one of these.</div>
      <div class="row"><div><label>Name</label><input id="k-name" placeholder="Customer IT push"></div>
        <div class="fixed"><button class="primary" id="k-add">Create key</button></div></div>
      <table style="margin-top:.9rem">
        <thead><tr><th class="l">Key</th><th class="l">Last used</th><th></th></tr></thead>
        <tbody>${keys.map(k => `<tr>
          <td class="l"><b>${esc(k.name)}</b> <code>${esc(k.prefix)}…</code></td>
          <td class="l">${k.last_used_at ? esc(k.last_used_at.slice(0, 16).replace("T", " ")) : "never"}</td>
          <td>${k.revoked ? '<span class="pill off">revoked</span>'
               : `<button class="sm danger" data-krevoke="${k.id}">Revoke</button>`}</td>
        </tr>`).join("") || `<tr><td class="l" colspan="3">No keys yet.</td></tr>`}</tbody>
      </table></div>`);

  // Each kind asks for what it actually needs, rather than one JSON box for
  // everything. A raw config field is a form that only its author can fill in.
  const FORMS = {
    rest: `<div class="row">
        <div><label>URL</label><input id="f-url" placeholder="https://crm.example.com/api/sales"></div>
        <div><label>Records path</label><input id="f-path" placeholder="data.reps"></div>
        <div><label>Token (optional)</label><input id="f-secret" type="password" placeholder="sent as a bearer token"></div>
      </div>
      <div class="hint" style="margin:.5rem 0 0">Records path is where the list of people sits in the reply. Leave it empty if the reply is already a list.</div>`,
    tableau: `<div class="row">
        <div><label>Server</label><input id="f-server" placeholder="https://10ay.online.tableau.com"></div>
        <div><label>Site</label><input id="f-site"></div>
        <div><label>Token name</label><input id="f-pat"></div>
      </div>
      <div class="row" style="margin-top:.6rem">
        <div><label>Workbook</label><input id="f-workbook"></div>
        <div><label>View</label><input id="f-view"></div>
        <div><label>Token secret</label><input id="f-secret" type="password"></div>
      </div>`,
    ingest: `<div class="hint" style="margin:0">Nothing to configure. Create an API key below and give it to whoever will push the data.</div>`,
    mock: `<div class="hint" style="margin:0">Generated figures, for trying the board out.</div>`,
  };

  const drawForm = () => { $("src-fields").innerHTML = FORMS[$("src-kind").value] || ""; };
  $("src-kind").onchange = drawForm;
  drawForm();

  $("src-add").onclick = () => guard(async () => {
    const kind = $("src-kind").value;
    const value = (id) => ($(id) ? $(id).value.trim() : "");
    const config = kind === "rest"
      ? { url: value("f-url"), records_path: value("f-path") }
      : kind === "tableau"
      ? { server: value("f-server"), site: value("f-site"), pat_name: value("f-pat"),
          workbook: value("f-workbook"), view: value("f-view") }
      : {};
    await api("/sources", { method: "POST", body: JSON.stringify({
      kind, name: $("src-name").value.trim() || "Source", config, secret: value("f-secret") }) });
    toast(kind === "rest" ? "Source added. Map its fields next." : "Source added", "good");
    render();
  });

  onClick("[data-map]", node => guard(async () => {
    const id = node.dataset.map;
    const found = await api(`/sources/${id}/discover`, { method: "POST" });
    const source = sources.find(s => String(s.id) === String(id));
    const saved = source.config.mapping || {};

    dialog(`Map ${esc(source.name)}`, `
      <div class="hint" style="margin:0 0 .6rem">${found.records} records, ${found.fields.length} fields.
        Guesses are filled in; change anything that is wrong.</div>
      ${MAPPABLE.map(([target, label, note]) => {
        const current = saved[target] || guessField(target, found.fields);
        return `<div class="moverow">
          <span>${label}${note ? ` <span class="hint" style="margin:0">${note}</span>` : ""}</span>
          <select data-m="${target}">
            <option value="">— not used —</option>
            ${found.fields.map(f => `<option value="${esc(f.field)}" ${f.field === current ? "selected" : ""}
              >${esc(f.field)}${f.looks_numeric ? " (number)" : ""}</option>`).join("")}
          </select></div>`;
      }).join("")}`,
      async (close) => {
        const mapping = {};
        $("modal").querySelectorAll("[data-m]").forEach(select => {
          if (select.value) mapping[select.dataset.m] = select.value;
        });
        if (!mapping.rep_name) throw new Error("Map a field to Name — without one there is nobody to rank.");
        await api(`/sources/${id}`, { method: "PATCH",
          body: JSON.stringify({ config: { ...source.config, mapping } }) });
        close();
        toast(`Mapped ${Object.keys(mapping).length} fields. Refresh to pull.`, "good");
        render();
      }, "Save mapping");
  }));

  onClick("[data-test]", node => guard(async () => {
    const result = await api(`/sources/${node.dataset.test}/test`, { method: "POST" });
    toast(result.message, result.ok ? "good" : "bad");
  }));

  onClick("[data-refresh]", node => guard(async () => {
    const result = await api(`/sources/${node.dataset.refresh}/refresh`, { method: "POST" });
    toast(`Loaded ${result.reps_seen} reps (${result.reps_created} new)`, "good"); render();
  }));

  onClick("[data-delsrc]", node => guard(async () => {
    if (!await confirmAsync("Delete this source?\nIts stored credential goes with it. Numbers it already loaded stay on the board.", "Delete")) return;
    await api(`/sources/${node.dataset.delsrc}/delete`, { method: "POST" });
    toast("Source deleted", "good"); render();
  }));

  $("k-add").onclick = () => guard(async () => {
    const created = await api("/api-keys", { method: "POST",
      body: JSON.stringify({ name: $("k-name").value.trim() || "Ingest key" }) });
    $("view").insertAdjacentHTML("afterbegin",
      `<div class="card" style="border-color:var(--good)"><h3>Copy this key now</h3>
        <code>${esc(created.token)}</code>
        <div class="hint" style="margin-top:.5rem">Stored hashed &mdash; it cannot be shown again.</div></div>`);
    toast("Key created", "good");
  });

  onClick("[data-krevoke]", node => guard(async () => {
    if (!await confirmAsync("Revoke this key? Anything pushing with it stops immediately.", "Revoke")) return;
    await api(`/api-keys/${node.dataset.krevoke}/revoke`, { method: "POST" });
    toast("Revoked", "good"); render();
  }));
};

views.audit = async () => {
  const { entries } = await api("/audit?limit=200");
  section("Audit", "Who changed what. Written as it happens, because it cannot be reconstructed later.", `
    <div class="card"><table>
      <thead><tr><th class="l">When</th><th class="l">Action</th><th class="l">Target</th><th class="l">By</th></tr></thead>
      <tbody>${entries.map(e => `<tr>
        <td class="l">${esc(e.at.slice(0, 19).replace("T", " "))}</td>
        <td class="l"><code>${esc(e.action)}</code></td>
        <td class="l">${esc(e.target)}</td>
        <td class="l">${esc(e.actor)}</td>
      </tr>`).join("") || `<tr><td class="l" colspan="4">Nothing recorded yet.</td></tr>`}</tbody>
    </table></div>`);
};

// ---------------------------------------------------------------- boot
async function render() {
  $("view").innerHTML = `<div class="hint">Loading…</div>`;
  try { await views[state.tab](); }
  catch (error) { section("Error", "", `<div class="card" style="color:#ff9a92">${esc(error.message)}</div>`); }
}

$("li-go").onclick = signIn;
$("li-pass").onkeydown = (e) => { if (e.key === "Enter") signIn(); };
$("passwd").onclick = () => dialog("Change your password", `
  <div><label>Current password</label><input id="p-old" type="password" autocomplete="current-password"></div>
  <div><label>New password</label><input id="p-new" type="password" autocomplete="new-password"></div>
  <div class="hint">At least 10 characters. Your other sessions will end; this one stays signed in.</div>`,
  async (close) => {
    const result = await api("/auth/password", { method: "POST", body: JSON.stringify({
      current_password: $("p-old").value, new_password: $("p-new").value }) });
    close();
    toast(`Password changed. ${result.other_sessions_ended} other session(s) ended.`, "good");
  }, "Change it");

$("logout").onclick = () => guard(async () => { await api("/auth/logout", { method: "POST" }); signOut(); });

if (state.token) start(); else { $("login").hidden = false; }
</script>
</body>
</html>
